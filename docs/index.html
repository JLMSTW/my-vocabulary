<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="My Vocab">
  <meta name="theme-color" content="#F2F3F6">
  <title>My Vocabulary</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/app.css">
  <script type="module" src="js/app.js"></script>

<body>
  <div class="app">
    <span id="data-badge" class="badge mock-badge" hidden>假資料</span>

    <main id="view" class="view" tabindex="-1"></main>

    <nav class="tabbar" aria-label="主要分頁">
      <a href="#/record" data-route="record">

        <span>紀錄</span>
      </a>
      <a href="#/flashcard" data-route="flashcard">

        <span>生字卡</span>
      </a>
      <a href="#/spelling" data-route="spelling">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13 7l4 4"/></svg>
        <span>拼字</span>
      </a>
      <a href="#/choice" data-route="choice">

        <span>選擇題</span>
      </a>

        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>
